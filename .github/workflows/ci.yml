name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Pin npm
        run: npm install -g npm@11.8.0

      - name: Check toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Format check
        run: npm run format:check

      - name: Build web
        run: npm run build --workspace @infranex/web

      - name: Build API
        run: npm run build --workspace @infranex/api
